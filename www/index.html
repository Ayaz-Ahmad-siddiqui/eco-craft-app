<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Eco Craft Kids Learning Game</title>
    <!-- Capacitor Native Bridge Layer -->
    <script src="capacitor.js"></script>
    <style>
      :root {
        --font-family: "Comic Sans MS", system-ui, -apple-system, sans-serif;
        --btn-grad: linear-gradient(135deg, #22c55e, #16a34a);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: radial-gradient(circle, #1e1b4b 0%, #0f172a 100%);
        color: #ffffff;
        font-family: var(--font-family);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: env(safe-area-inset-top, 12px) 12px
          env(safe-area-inset-bottom, 12px) 12px;
      }

      /* Category Selection Screen Styles */
      #category-screen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle, #312e81 0%, #0f172a 100%);
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 15px;
        overflow-y: auto;
      }

      .cat-header {
        text-align: center;
        margin-bottom: 20px;
        margin-top: 10px;
      }

      .cat-title {
        font-size: 2.2rem;
        font-weight: 900;
        background: linear-gradient(135deg, #fbbf24, #f43f5e, #38bdf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }

      .cat-subtitle {
        font-size: 1rem;
        color: #cbd5e1;
        margin-top: 4px;
        font-weight: 700;
      }

      .cat-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        width: 100%;
        max-width: 500px;
        padding-bottom: 30px;
      }

      .cat-card {
        background: rgba(30, 41, 59, 0.85);
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      }

      .cat-card:active {
        transform: scale(0.94);
      }

      .cat-icon {
        font-size: 3.2rem;
        margin-bottom: 6px;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      }

      .cat-label {
        font-size: 1.05rem;
        font-weight: 900;
        text-align: center;
        color: #ffffff;
      }

      .cat-badge {
        font-size: 0.7rem;
        background: rgba(255, 255, 255, 0.15);
        padding: 2px 8px;
        border-radius: 10px;
        margin-top: 4px;
        color: #fbbf24;
        font-weight: 800;
      }

      /* Game Header & Viewport */
      header {
        width: 100%;
        max-width: 600px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 5px;
        z-index: 10;
      }

      .title-logo {
        font-size: 1.3rem;
        font-weight: 900;
        background: linear-gradient(135deg, #f43f5e, #fbbf24);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .stats-container {
        display: flex;
        gap: 6px;
      }

      .stat-badge {
        background: rgba(30, 41, 59, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        padding: 5px 10px;
        font-size: 0.8rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .stat-badge.gold { border-color: #fbbf24; color: #fbbf24; }
      .stat-badge.lvl { border-color: #38bdf8; color: #38bdf8; }

      .btn-back-cat {
        background: rgba(239, 68, 68, 0.25);
        border: 2px solid #ef4444;
        color: white;
        padding: 5px 12px;
        border-radius: 16px;
        font-weight: 800;
        font-size: 0.8rem;
        cursor: pointer;
      }

      .game-viewport {
        flex-grow: 1;
        width: 100%;
        max-width: 600px;
        position: relative;
        background: rgba(255, 255, 255, 0.03);
        border: 3px dashed rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        margin: 8px 0;
        overflow: hidden;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
      }

      .progress-container {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        z-index: 15;
        width: 85%;
      }

      .progress-bar {
        width: 100%;
        height: 16px;
        background: rgba(15, 23, 42, 0.85);
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #a855f7, #ec4899);
        border-radius: 8px;
        transition: width 0.3s ease-out;
      }

      .goal-label {
        font-size: 0.85rem;
        font-weight: 900;
        color: #e2e8f0;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        text-align: center;
      }

      .fruit-item {
        position: absolute;
        cursor: pointer;
        z-index: 20;
        transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        padding: 8px;
      }

      .fruit-item.selected {
        transform: scale(1.35) !important;
        filter: drop-shadow(0 0 25px #ffffff) brightness(1.2) !important;
        z-index: 50;
      }

      @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .fruit-text-hint {
        position: absolute;
        background: rgba(15, 23, 42, 0.9);
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 900;
        padding: 2px 6px;
        border-radius: 8px;
        white-space: nowrap;
        top: -16px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        border: 2px solid white;
        text-transform: uppercase;
      }

      .float-text {
        position: absolute;
        color: #22c55e;
        font-weight: 900;
        font-size: 1.4rem;
        pointer-events: none;
        animation: riseFade 0.8s forwards ease-out;
        text-shadow: 0px 4px 6px rgba(0, 0, 0, 1);
        z-index: 100;
      }

      .fruit-announcement-text {
        position: absolute;
        font-weight: 900;
        font-size: 2rem;
        pointer-events: none;
        z-index: 120;
        text-align: center;
        transform: translate(-50%, -50%);
        animation: epicPopReveal 1.2s forwards cubic-bezier(0.175, 0.885, 0.32, 1.5);
        text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        -webkit-text-stroke: 1.5px #ffffff;
      }

      @keyframes epicPopReveal {
        0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
        30% { transform: scale(1.2) rotate(8deg); opacity: 1; }
        50% { transform: scale(1) rotate(-4deg); opacity: 1; }
        100% { transform: scale(0.8) translateY(-60px); opacity: 0; }
      }

      @keyframes riseFade {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
      }

      .control-deck {
        width: 100%;
        max-width: 600px;
        background: rgba(30, 41, 59, 0.95);
        border-top: 4px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px 28px 0 0;
        padding: 12px 10px;
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      }

      .basket-row {
        display: flex;
        justify-content: space-around;
        gap: 8px;
      }

      .fruit-basket {
        flex: 1;
        max-width: 110px;
        aspect-ratio: 0.95;
        background: rgba(15, 23, 42, 0.7);
        border: 4px solid transparent;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: all 0.1s ease;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      }

      .fruit-basket:active { transform: scale(0.9); }

      .basket-icon {
        font-size: 2.2rem;
        margin-bottom: 2px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      }

      .basket-label {
        font-size: 0.75rem;
        font-weight: 900;
        text-transform: uppercase;
        text-align: center;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 23, 42, 0.96);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }

      .modal-content {
        background: #1e293b;
        border: 4px solid #22c55e;
        border-radius: 32px;
        padding: 30px 20px;
        text-align: center;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 0 35px rgba(34, 197, 94, 0.3);
      }

      .modal-badge {
        font-size: 4rem;
        margin-bottom: 10px;
        animation: bounce 1.2s infinite;
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      .modal-title {
        font-size: 1.7rem;
        font-weight: 900;
        color: #4ade80;
        margin-bottom: 8px;
      }

      .modal-desc {
        font-size: 0.95rem;
        color: #cbd5e1;
        line-height: 1.4;
        margin-bottom: 20px;
      }

      .modal-btn {
        background: var(--btn-grad);
        border: 3px solid #4ade80;
        width: 100%;
        height: 52px;
        border-radius: 18px;
        color: white;
        font-weight: 900;
        font-size: 1.05rem;
        box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
        cursor: pointer;
      }
    </style>
  </head>

    <script>
      let audioCtx;
      function initAudio() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      }

      function playTone(freq, type, duration) {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.type = type;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.01,
          audioCtx.currentTime + duration
        );
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      function playSuccessSound() {
        playTone(523.25, "sine", 0.1);
        setTimeout(() => playTone(659.25, "sine", 0.1), 80);
        setTimeout(() => playTone(783.99, "sine", 0.2), 160);
      }
      function playErrorSound() {
        playTone(160, "sawtooth", 0.25);
      }
      function playWinSound() {
        playTone(523.25, "sine", 0.1);
        setTimeout(() => playTone(587.33, "sine", 0.1), 100);
        setTimeout(() => playTone(659.25, "sine", 0.1), 200);
        setTimeout(() => playTone(880.0, "sine", 0.4), 300);
      }

      // VOICE TTS ENGINE
      async function speakText(text) {
        try {
          if (
            window.Capacitor &&
            window.Capacitor.Plugins &&
            window.Capacitor.Plugins.TextToSpeech
          ) {
            await window.Capacitor.Plugins.TextToSpeech.speak({
              text: text,
              lang: "en-US",
              rate: 1.0,
              pitch: 1.0,
              volume: 1.0,
              category: "ambient",
            });
            return;
          }
        } catch (e) {}

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "en-US";
          utterance.pitch = 1.2;
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      }

      function createEpicPopup(text, color) {
        const playArea = document.getElementById("play-area");
        const alertEl = document.createElement("div");
        alertEl.className = "fruit-announcement-text";
        alertEl.innerText = text;
        alertEl.style.color = color;
        alertEl.style.left = "50%";
        alertEl.style.top = "50%";

        playArea.appendChild(alertEl);
        setTimeout(() => alertEl.remove(), 1200);
      }

            { level: 10, name: "Shapes Master", target: 10, items: [{ type: "cube", icon: "🧊", name: "Ice Cube", color: "#38bdf8" }, { type: "pyramid", icon: "🔺", name: "Pyramid", color: "#ea580c" }, { type: "badge", icon: "🔰", name: "Shield Shape", color: "#84cc16" }] }
          ]
        },
        {
          // CATEGORY 10: IQ MIX CHALLENGE
          id: 'iq_mix',
          name: 'IQ Mix Challenge',
          icon: '🧠',
          color: '#06b6d4',
          levels: [] // Dynamically generated in script below
        }
      ];

      // DYNAMIC IQ MIX LEVEL GENERATOR (PULLS FROM ALL 9 CATEGORIES)
      (function buildIQMixLevels() {
        const iqCategory = categoriesData.find(c => c.id === 'iq_mix');
        const allItemsList = [];

        // Collect all items from categories 1 to 9
        categoriesData.forEach(cat => {
          if (cat.id !== 'iq_mix') {
            cat.levels.forEach(lvl => {
              lvl.items.forEach(item => {
                if (!allItemsList.some(i => i.type === item.type)) {
                  allItemsList.push(item);
                }
              });
            });
          }
        });

        // Create 10 challenging IQ levels with mixed items
        for (let l = 1; l <= 10; l++) {
          const target = 5 + Math.min(l, 5); // Target increases with levels
          const shuffled = [...allItemsList].sort(() => 0.5 - Math.random());
          const levelItems = shuffled.slice(0, 3 + (l % 2)); // 3 or 4 mixed items per level

          iqCategory.levels.push({
            level: l,
            name: `IQ Test Level ${l}`,
            target: target,
            items: levelItems
          });
        }
      })();

      let currentCatIdx = 0;
      let currentLvlIdx = 0;
      let state = { score: 0, coins: 0, activeItem: null, spawnTimer: null };

      function populateCategories() {
        const grid = document.getElementById("category-grid");
        grid.innerHTML = "";
        categoriesData.forEach((cat, index) => {
          const card = document.createElement("div");
          card.className = "cat-card";
          card.style.borderColor = cat.color;
          card.innerHTML = `
            <div class="cat-icon">${cat.icon}</div>
            <div class="cat-label">${cat.name}</div>
            <div class="cat-badge">${cat.levels.length} Levels</div>
          `;
          card.onclick = () => selectCategory(index);
          grid.appendChild(card);
        });
      }

      function openCategoryMenu() {
        if (state.spawnTimer) clearInterval(state.spawnTimer);
        document.getElementById("category-screen").style.display = "flex";
      }

      function selectCategory(catIndex) {
        currentCatIdx = catIndex;
        document.getElementById("category-screen").style.display = "none";
        loadLevel(0);
      }

      function loadLevel(lvlIdx) {
        currentLvlIdx = lvlIdx;
        const currentCat = categoriesData[currentCatIdx];
        const config = currentCat.levels[currentLvlIdx];

        state.score = 0;
        state.activeItem = null;

        document.getElementById("active-cat-title").innerText = `${currentCat.name} ${currentCat.icon}`;
        document.getElementById("play-area").querySelectorAll(".fruit-item").forEach((e) => e.remove());

        document.getElementById("level-display").innerText = `Level ${config.level}`;
        document.getElementById("objective-label").innerText = `${config.name} (Goal: ${config.target})`;

        const basketContainer = document.getElementById("basket-container");
        basketContainer.innerHTML = "";

        config.items.forEach((item) => {
          const bEl = document.createElement("div");
          bEl.className = "fruit-basket";
          bEl.style.borderColor = item.color;
          bEl.style.boxShadow = `0 0 12px ${item.color}33`;
          bEl.innerHTML = `
            <div class="basket-icon">${item.icon}</div>
            <div class="basket-label" style="color: ${item.color}">${item.name}</div>
          `;

          const triggerAction = () => attemptMatch(item.type);
          bEl.addEventListener("click", triggerAction);
          bEl.addEventListener("touchstart", (e) => {
            e.preventDefault();
            triggerAction();
          });

          basketContainer.appendChild(bEl);
        });

        updateHUD();

        if (state.spawnTimer) clearInterval(state.spawnTimer);
        state.spawnTimer = setInterval(spawnItem, 1900);

        for (let i = 0; i < 3; i++) {
          spawnItem();
        }
      }

      function spawnItem() {
        const currentCat = categoriesData[currentCatIdx];
        const config = currentCat.levels[currentLvlIdx];
        if (state.score >= config.target) return;

        const playArea = document.getElementById("play-area");
        const itemObj = config.items[Math.floor(Math.random() * config.items.length)];

        const element = document.createElement("div");
        element.className = "fruit-item";
        element.id = `item-${Date.now()}-${Math.random()}`;
        element.dataset.type = itemObj.type;
        element.style.filter = `drop-shadow(0 0 14px ${itemObj.color})`;
        element.innerHTML = `
          <div class="fruit-text-hint" style="border-color: ${itemObj.color}; color: ${itemObj.color}">${itemObj.name} ${itemObj.icon}</div>
          <span style="font-size: 3.4rem; display: block;">${itemObj.icon}</span>
        `;

        const x = Math.floor(Math.random() * 70) + 5;
        const y = Math.floor(Math.random() * 55) + 20;
        element.style.left = `${x}%`;
        element.style.top = `${y}%`;

        const triggerSelect = (e) => {
          initAudio();
          selectItem(element);
          e.stopPropagation();
          e.preventDefault();
        };

        element.addEventListener("click", triggerSelect);
        element.addEventListener("touchstart", triggerSelect, { passive: false });

        playArea.appendChild(element);
      }

      function selectItem(element) {
        playTone(450, "sine", 0.05);
        document.querySelectorAll(".fruit-item").forEach((f) => f.classList.remove("selected"));
        state.activeItem = element;
        element.classList.add("selected");
      }

      function attemptMatch(basketType) {
        initAudio();
        if (!state.activeItem) {
          playErrorSound();
          return;
        }

        const itemType = state.activeItem.dataset.type;
        const currentCat = categoriesData[currentCatIdx];
        const config = currentCat.levels[currentLvlIdx];

        if (itemType === basketType) {
          playSuccessSound();

          const matchedObj = config.items.find((f) => f.type === itemType);

          if (matchedObj) {
            speakText(matchedObj.name);
            createEpicPopup(
              `${matchedObj.icon} ${matchedObj.name}!`,
              matchedObj.color
            );
          }

          state.score++;
          state.coins += 10;

          createFloatingText(
            "+10 🪙",
            window.innerWidth / 2,
            window.innerHeight / 2
          );

          state.activeItem.remove();
          state.activeItem = null;

          updateHUD();
          checkWin();
        } else {
          playErrorSound();
          createFloatingText(
            "Try Again! ❌",
            window.innerWidth / 2,
            window.innerHeight / 2
          );
        }
      }

      function createFloatingText(text, x, y) {
        const popup = document.createElement("div");
        popup.className = "float-text";
        popup.innerText = text;
        popup.style.left = `${x - 40}px`;
        popup.style.top = `${y - 20}px`;
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 800);
      }

      function updateHUD() {
        const currentCat = categoriesData[currentCatIdx];
        const config = currentCat.levels[currentLvlIdx];
        document.getElementById("coin-count").innerText = state.coins;

        const percentage = (state.score / config.target) * 100;
        document.getElementById("progress-fill-bar").style.width = `${percentage}%`;
      }

      function checkWin() {
        const currentCat = categoriesData[currentCatIdx];
        const config = currentCat.levels[currentLvlIdx];
        if (state.score >= config.target) {
          clearInterval(state.spawnTimer);
          document.querySelectorAll(".fruit-item").forEach((f) => f.remove());

          setTimeout(() => {
            playWinSound();
            showVictoryModal();
          }, 400);
        }
      }

      function showVictoryModal() {
        const modal = document.getElementById("victory-modal");
        const title = document.getElementById("modal-title");
        const desc = document.getElementById("modal-desc");
        const btn = document.getElementById("modal-action-btn");
        const emoji = document.getElementById("modal-emoji");
        const currentCat = categoriesData[currentCatIdx];

        if (currentLvlIdx < currentCat.levels.length - 1) {
          const nextLevelNum = currentCat.levels[currentLvlIdx + 1].level;
          emoji.innerText = "🎉🎈";
          title.innerText = `Level ${currentCat.levels[currentLvlIdx].level} Cleared!`;
          desc.innerText = `Great job matching ${currentCat.name}! Ready for the next level?`;
          btn.innerText = `START LEVEL ${nextLevelNum} ➔`;
        } else {
          emoji.innerText = "👑🏆";
          title.innerText = `${currentCat.name} Master!`;
          desc.innerText = `Awesome! You completed all ${currentCat.levels.length} levels in ${currentCat.name}!`;
          btn.innerText = "CHOOSE ANOTHER CATEGORY 🏠";
        }
        modal.style.display = "flex";
      }

      function modalAction() {
        document.getElementById("victory-modal").style.display = "none";
        const currentCat = categoriesData[currentCatIdx];

        if (currentLvlIdx < currentCat.levels.length - 1) {
          loadLevel(currentLvlIdx + 1);
        } else {
          openCategoryMenu();
        }
      }

      window.onload = () => {
        populateCategories();
        openCategoryMenu();

        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
          if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
          }
        }
        document.body.addEventListener("touchstart", initAudio, { passive: true });
        document.body.addEventListener("click", initAudio);
      };
    </script>
  </body>
</html>
